# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        12.5

# Look
background_opacity 0.92
window_padding_width 12
hide_window_decorations no
confirm_os_window_close 0

# Cursor
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5
cursor_trail 3

# Behavior
scrollback_lines 10000
copy_on_select clipboard
mouse_hide_wait 3
url_style curly
enable_audio_bell no

# Theme (colors)
include mocha.conf

# Tab bar (after the theme so these win)
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_title_template " {index}: {title} "
tab_bar_background #181825
active_tab_background #cba6f7
active_tab_foreground #1e1e2e
inactive_tab_background #313244
inactive_tab_foreground #cdd6f4

# Splits
enabled_layouts splits,stack
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+minus     launch --location=hsplit --cwd=current
map ctrl+shift+z         toggle_layout stack

# Jump to tab with Alt+number
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
